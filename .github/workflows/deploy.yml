name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN 未配置。请在仓库 Settings > Secrets and variables > Actions 中添加名为 VERCEL_TOKEN 的密钥（值来自 https://vercel.com/account/tokens）"
            exit 1
          fi
          echo "Token 已存在，校验身份..."
          npx vercel whoami --token="$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN 校验失败，请确认 token 有效、未过期且具有部署权限"
            exit 1
          }

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          # Supabase Postgres 连接串：从仓库 Secrets 或 Variables 读取，部署时注入 Vercel 运行时。
          # db.js 通过 process.env.SUPABASE_DB_URL 直连 Supabase 的 Postgres 数据库（数据真实存放在 Supabase）。
          # 在 Supabase 控制台 Settings → Database → Connection string 复制「URI」格式，
          # 形如 postgresql://postgres:<password>@db.<project>.supabase.co:5432/postgres
          # 同时兼容「Secrets」与「Variables」两种配置位置（优先 Secrets）。
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || vars.SUPABASE_DB_URL }}
        run: |
          # Vercel 项目名必须全小写，不能依赖仓库目录名（如 Freedom 大写会 400 失败）
          PROJECT_NAME="${VERCEL_PROJECT_NAME:-freedom}"

          # 将 Supabase 连接串注入 Vercel 运行时环境变量（仅非空时注入，避免覆盖/清空已手动配置的值）
          EXTRA_ENV=""
          if [ -n "$SUPABASE_DB_URL" ]; then
            EXTRA_ENV="$EXTRA_ENV -e SUPABASE_DB_URL=$SUPABASE_DB_URL"
          fi

          # shellcheck disable=SC2086
          npx vercel deploy --prod --yes --debug --name "$PROJECT_NAME" --token="$VERCEL_TOKEN" $EXTRA_ENV
