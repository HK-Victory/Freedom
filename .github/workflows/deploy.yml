name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # 每小时触发一次；实际发送小时由「提醒设置」页面的 hour 控制（北京时间）

jobs:
  deploy:
    # 仅在 push / 手动触发时部署，避免定时任务（每小时）也触发重新部署
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN 未配置。请在仓库 Settings > Secrets and variables > Actions 中添加名为 VERCEL_TOKEN 的密钥（值来自 https://vercel.com/account/tokens）"
            exit 1
          fi
          echo "Token 已存在，校验身份..."
          npx vercel whoami --token="$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN 校验失败，请确认 token 有效、未过期且具有部署权限"
            exit 1
          }

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
        run: |
          # Vercel 项目名必须全小写，不能依赖仓库目录名（如 Freedom 大写会 400 失败）
          PROJECT_NAME="${VERCEL_PROJECT_NAME:-freedom}"
          npx vercel deploy --prod --yes --debug --name "$PROJECT_NAME" --token="$VERCEL_TOKEN"

  remind:
    # 定时提醒：每小时调用线上 /api/cron/reminders，由「提醒设置」页面的 hour 控制具体发送时刻
    # 需在仓库 Secrets 配置 REMINDER_URL（部署成功后的 Vercel 地址）与 CRON_SECRET
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily task reminders
        env:
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ]; then
            echo "REMINDER_URL 未配置，跳过每日提醒。"
            exit 0
          fi
          curl -fsS -X GET "$REMINDER_URL/api/cron/reminders?secret=$CRON_SECRET"
