name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN 未配置。请在仓库 Settings > Secrets and variables > Actions 中添加名为 VERCEL_TOKEN 的密钥（值来自 https://vercel.com/account/tokens）"
            exit 1
          fi
          echo "Token 已存在，校验身份..."
          npx vercel whoami --token="$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN 校验失败，请确认 token 有效、未过期且具有部署权限"
            exit 1
          }

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          # Blob 持久化凭据：从仓库 Secrets 或 Variables 读取，部署时注入 Vercel 运行时。
          # @vercel/blob 在 serverless 函数执行时从 process.env 读取 BLOB_READ_WRITE_TOKEN
          # （storeId 由 token 自身解析），必须存在于 Vercel 运行时，否则数据每次部署都会回退种子、被清空。
          # 同时兼容「Secrets」与「Variables」两种配置位置（优先 Secrets）。
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || vars.BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID || vars.BLOB_STORE_ID }}
          # 定时提醒鉴权密钥：注入 Vercel 运行时后，/api/cron/reminders 才会真正校验 secret，
          # 否则该接口对任何人开放（仅靠 URL 不可预测性防调用）。
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          # Vercel 项目名必须全小写，不能依赖仓库目录名（如 Freedom 大写会 400 失败）
          PROJECT_NAME="${VERCEL_PROJECT_NAME:-freedom}"

          # 将 Blob 凭据注入 Vercel 运行时环境变量（仅非空时注入，避免覆盖/清空已手动配置的值）
          EXTRA_ENV=""
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            EXTRA_ENV="$EXTRA_ENV -e BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN"
          fi
          if [ -n "$BLOB_STORE_ID" ]; then
            EXTRA_ENV="$EXTRA_ENV -e BLOB_STORE_ID=$BLOB_STORE_ID"
          fi
          if [ -n "$CRON_SECRET" ]; then
            EXTRA_ENV="$EXTRA_ENV -e CRON_SECRET=$CRON_SECRET"
          fi

          # shellcheck disable=SC2086
          npx vercel deploy --prod --yes --debug --name "$PROJECT_NAME" --token="$VERCEL_TOKEN" $EXTRA_ENV
