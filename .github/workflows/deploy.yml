name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# =============================================================
# 部署配置项（集中读取自 GitHub Actions 的 Secrets / Variables）
# 配置入口：仓库 Settings → Secrets and variables → Actions
#   • Secrets 标签页：存放含密码的敏感项
#       - VERCEL_TOKEN            Vercel 部署令牌（必填）
#       - SUPABASE_SERVICE_ROLE_KEY  Supabase 服务角色密钥（推荐；后端建表/读写全表权限）
#       - SUPABASE_ANON_KEY       Supabase 匿名密钥（后端无 service_role 时回退使用；不下发前端）
#       - SUPABASE_DB_URL         （可选兼容）早期直连串，未配置时忽略
#       - CRON_SECRET             定时提醒调用密钥（可选）
#   • Variables 标签页：存放非敏感项
#       - VERCEL_PROJECT_NAME      Vercel 项目名（默认 freedom，必须全小写）
#       - SUPABASE_URL             Supabase 项目地址，形如 https://<project-ref>.supabase.co（必填）
#       - APP_URL                 部署后的正式域名，用于邮件提醒链接（可选）
# 约定：含密码的项优先读 Secrets，找不到再回退到 Variables；非敏感项直接读 Variables。
# 下方 env 仅做「取值」，真正的注入在 Deploy 步骤用 `vercel deploy -e` 完成。
# =============================================================
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'freedom' }}
  # 注意：URL 本身不敏感，按约定应放 Variables；但实际很容易顺手放进 Secrets。
  # 若这里只读 vars，就会出现「密钥读到了、URL 没读到」→ 运行时静默降级 SQLite。
  # 因此非敏感项也统一 vars 优先、secrets 兜底，放哪都能生效。
  SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || vars.SUPABASE_DB_URL }}
  APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN 未配置。请在仓库 Settings → Secrets and variables → Actions → Secrets 中添加名为 VERCEL_TOKEN 的密钥（值来自 https://vercel.com/account/tokens）"
            exit 1
          fi
          echo "Token 已存在，校验身份..."
          npx vercel whoami --token="$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN 校验失败，请确认 token 有效、未过期且具有部署权限"
            exit 1
          }

      - name: 校验 Supabase 部署配置
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL 未配置（Variables 和 Secrets 两个标签页都没找到），应用将使用本地 SQLite 兜底（数据仅进程内，重启/Vercel 冷启动不持久）。如需持久化，请添加 SUPABASE_URL（形如 https://<project-ref>.supabase.co）与 SUPABASE_SERVICE_ROLE_KEY（或 SUPABASE_ANON_KEY）。"
          else
            echo "SUPABASE_URL 已配置: $SUPABASE_URL"
            if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "::warning::SUPABASE_URL 已配置但缺少密钥（SUPABASE_SERVICE_ROLE_KEY / SUPABASE_ANON_KEY），后端无法连接 Supabase，将降级到 SQLite 兜底。"
            else
              echo "Supabase 密钥已就绪，将注入 Vercel 运行时。"
            fi
          fi

          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL 未配置，邮件提醒中的链接将使用占位域名 https://your-vercel-app.vercel.app。如需正确跳转，请在 Variables 添加 APP_URL（部署后的正式域名）。"
          fi

      - name: Deploy to Vercel (Production)
        run: |
          # Vercel 项目名必须全小写，不能依赖仓库目录名（如 Freedom 大写会 400 失败）
          PROJECT_NAME="${VERCEL_PROJECT_NAME:-freedom}"

          # 将部署配置注入 Vercel 运行时环境变量（仅非空时注入，避免覆盖/清空已手动配置的值）
          # 用数组而非字符串拼接：密钥里可能含空格/引号等特殊字符，
          # 字符串拼接后展开会被 word-splitting 截断，导致注入的值不完整。
          EXTRA_ENV=()
          add_env() {
            # $1=变量名 $2=值；值为空则跳过
            [ -n "$2" ] && EXTRA_ENV+=(-e "$1=$2")
            return 0
          }
          add_env SUPABASE_URL "$SUPABASE_URL"
          add_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_env SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          add_env SUPABASE_DB_URL "$SUPABASE_DB_URL"
          add_env APP_URL "$APP_URL"
          add_env CRON_SECRET "$CRON_SECRET"

          npx vercel deploy --prod --yes --debug --name "$PROJECT_NAME" --token="$VERCEL_TOKEN" "${EXTRA_ENV[@]}"
