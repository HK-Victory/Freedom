name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # 每天 09:00（北京时间）触发任务到期提醒

jobs:
  deploy:
    # 仅在 push / 手动触发时部署，避免每日定时也重新部署
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify EdgeOne token
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN 未配置。请在仓库 Settings > Secrets and variables > Actions 中添加名为 EDGEONE_API_TOKEN 的密钥（值来自 https://edgeone.ai/document/177158578324279296 的 API Token）"
            exit 1
          fi
          echo "EDGEONE_API_TOKEN 已存在，开始部署。"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy to EdgeOne Pages (Production)
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
        run: |
          # EdgeOne 项目名用小写；仓库 Secrets 里可加 EDGEONE_PROJECT_NAME 覆盖
          PROJECT_NAME="${EDGEONE_PROJECT_NAME:-freedom}"
          npx edgeone pages deploy ./h5-app/dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN"

  remind:
    # 每日定时：调用线上 /api/cron/reminders 发送到期提醒
    # 需在仓库 Secrets 配置 REMINDER_URL（部署成功后的 EdgeOne 地址）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily task reminders
        env:
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ]; then
            echo "REMINDER_URL 未配置，跳过每日提醒。"
            exit 0
          fi
          curl -fsS -X GET "$REMINDER_URL/api/cron/reminders?secret=$CRON_SECRET"
