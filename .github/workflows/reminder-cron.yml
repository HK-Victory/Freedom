name: 定时提醒 (Task Reminder Cron)

# 说明：定时提醒由两条独立的触发链共同保障，端点本身按「北京时间 hour == 页面配置的发送小时」
#       做二次校验，只有命中才真正发送，因此两条链都只需每小时轮询一次：
#   ① Vercel Cron（vercel.json 的 crons 字段）——由 Vercel 平台在每小时第 0 分钟直接调用
#      /api/cron/reminders；Vercel 配置 CRON_SECRET 后会自动在 Authorization 头带上
#      明文 Bearer <CRON_SECRET>，服务端（lib/cronAuth.js）直接比对。
#   ② 本 GitHub Actions 工作流——每小时第 0 分钟请求一次同一端点（带 ?secret=CRON_SECRET）。
# 双链互为冗余：任一平台调度抖动/故障，另一条仍可兜底。端点内置「当日 sent=1」去重，
# 即便两条链在同一分钟都命中配置小时，也不会重复发送邮件。
#
# 鉴权：端点要求 CRON_SECRET 一致（若已在 Vercel 项目环境变量 / 仓库 Secrets-Variables 配置）。
# 配置入口（GitHub Actions 侧）：仓库 Settings → Secrets and variables → Actions
#   • Secrets:  CRON_SECRET（可选，未配置则端点不校验，任何人可调用，建议配置）
#   • Variables: APP_URL（部署后的正式域名，如 https://freedom-ten-phi.vercel.app；
#               未配置则回退到下方默认值）
# 注：Vercel Cron 侧还需要在 Vercel 项目 Environment Variables 里配置同名 CRON_SECRET，
#     否则 Vercel 不会在 Authorization 头带 Bearer 令牌、服务端比对会失败（端点会因 CRON_SECRET 已设而 401）。

on:
  schedule:
    # 每小时第 0 分钟触发一次（UTC；北京时间 = UTC+8，覆盖 0~23 点每个整点）。
    # 端点自身按「配置的发送小时」放行，这里只需保证足够密的覆盖即可。
    - cron: '0 * * * *'
  # 允许在 Actions 页面手动点一次立即验证
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL || 'https://freedom-ten-phi.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || '' }}
    steps:
      - name: 触发 /api/cron/reminders
        run: |
          URL="${APP_URL}/api/cron/reminders"
          if [ -n "$CRON_SECRET" ]; then
            URL="${URL}?secret=${CRON_SECRET}"
          else
            echo "::warning::CRON_SECRET 未配置，端点将不校验身份（建议到仓库 Secrets 添加 CRON_SECRET）。"
          fi

          echo "调用: $URL"
          # 最多重试 3 次，间隔 20s，规避 GitHub Actions 调度偶尔的抖动 / 瞬时网络失败
          for i in 1 2 3; do
            echo "--- 第 $i 次尝试 ---"
            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 60 "$URL")
            BODY=$(cat /tmp/resp.json 2>/dev/null)
            echo "HTTP $HTTP_CODE"
            echo "响应: $BODY"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "::notice::定时提醒端点调用成功"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "非 200，20s 后重试..."
              sleep 20
            fi
          done
          echo "::error::定时提醒端点调用失败（连续 3 次非 200）"
          exit 1
